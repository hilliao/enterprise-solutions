<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="ai-invest-title ai-invest-desc" font-family="Inter, 'Segoe UI', Roboto, sans-serif">
    <title id="ai-invest-title">AI Invest Service Offering</title>
    <desc id="ai-invest-desc">Illustration of an upward equity curve produced by GPU-accelerated large language
        models: a neural network feeds a rising portfolio line ending in a real-time intraday insight, powered by
        an NVIDIA GPU chip.
    </desc>

    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0b2b63"/>
            <stop offset="0.55" stop-color="#123a7d"/>
            <stop offset="1" stop-color="#174ea6"/>
        </linearGradient>
        <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#34a853" stop-opacity="0.38"/>
            <stop offset="1" stop-color="#34a853" stop-opacity="0"/>
        </linearGradient>
        <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Canvas -->
    <rect width="800" height="500" rx="24" fill="url(#bg)"/>

    <!-- Recessive gridlines -->
    <g stroke="#ffffff" stroke-opacity="0.07">
        <line x1="60" y1="160" x2="740" y2="160"/>
        <line x1="60" y1="220" x2="740" y2="220"/>
        <line x1="60" y1="280" x2="740" y2="280"/>
        <line x1="60" y1="340" x2="740" y2="340"/>
        <line x1="60" y1="400" x2="740" y2="400"/>
    </g>
    <line x1="60" y1="430" x2="740" y2="430" stroke="#ffffff" stroke-opacity="0.18"/>

    <!-- Faint candlesticks (market backdrop) -->
    <g fill="#8ab4f8" fill-opacity="0.16" stroke="#8ab4f8" stroke-opacity="0.22">
        <line x1="127" y1="330" x2="127" y2="415"/>
        <rect x="120" y="350" width="14" height="52" rx="4"/>
        <line x1="207" y1="300" x2="207" y2="405"/>
        <rect x="200" y="322" width="14" height="60" rx="4"/>
        <line x1="287" y1="315" x2="287" y2="410"/>
        <rect x="280" y="338" width="14" height="50" rx="4"/>
        <line x1="367" y1="270" x2="367" y2="390"/>
        <rect x="360" y="292" width="14" height="72" rx="4"/>
        <line x1="447" y1="255" x2="447" y2="380"/>
        <rect x="440" y="276" width="14" height="80" rx="4"/>
        <line x1="527" y1="225" x2="527" y2="360"/>
        <rect x="520" y="248" width="14" height="86" rx="4"/>
    </g>

    <!-- Portfolio curve: area then 3px rounded line -->
    <path d="M60 360 L140 330 L220 345 L300 290 L380 305 L460 240 L540 255 L620 190 L700 150
             L700 430 L60 430 Z" fill="url(#area)"/>
    <path d="M60 360 L140 330 L220 345 L300 290 L380 305 L460 240 L540 255 L620 190 L700 150"
          fill="none" stroke="#34a853" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Live endpoint with intraday-insight chip -->
    <circle cx="700" cy="150" r="7" fill="#34a853" stroke="#ffffff" stroke-width="2.5" filter="url(#glow)"/>
    <g>
        <rect x="536" y="92" width="180" height="38" rx="19" fill="#34a853"/>
        <path d="M556 116 l9 -12 9 12 z" fill="#ffffff"/>
        <text x="582" y="117" fill="#ffffff" font-size="16" font-weight="600">Intraday insight</text>
    </g>

    <!-- LLM neural network feeding the curve -->
    <g stroke="#8ab4f8" stroke-opacity="0.55" stroke-width="1.5">
        <line x1="98" y1="78" x2="168" y2="52"/>
        <line x1="98" y1="78" x2="168" y2="110"/>
        <line x1="98" y1="142" x2="168" y2="52"/>
        <line x1="98" y1="142" x2="168" y2="110"/>
        <line x1="168" y1="52" x2="240" y2="82"/>
        <line x1="168" y1="110" x2="240" y2="82"/>
    </g>
    <path d="M240 82 C 300 90, 320 200, 300 288" fill="none" stroke="#8ab4f8" stroke-opacity="0.45"
          stroke-width="1.5" stroke-dasharray="2 6" stroke-linecap="round"/>
    <g>
        <circle cx="98" cy="78" r="7" fill="#8ab4f8"/>
        <circle cx="98" cy="142" r="7" fill="#8ab4f8"/>
        <circle cx="168" cy="52" r="7" fill="#fbbc04"/>
        <circle cx="168" cy="110" r="7" fill="#fbbc04"/>
        <circle cx="240" cy="82" r="10" fill="#ffffff"/>
        <circle cx="240" cy="82" r="5" fill="#1a73e8"/>
    </g>
    <text x="86" y="178" fill="#ffffff" fill-opacity="0.85" font-size="14" font-weight="600"
          letter-spacing="1.5">LLM RESEARCH
    </text>

    <!-- NVIDIA GPU chip powering inference -->
    <g>
        <g stroke="#8ab4f8" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round">
            <line x1="596" y1="352" x2="581" y2="352"/>
            <line x1="596" y1="372" x2="581" y2="372"/>
            <line x1="596" y1="392" x2="581" y2="392"/>
            <line x1="724" y1="352" x2="739" y2="352"/>
            <line x1="724" y1="372" x2="739" y2="372"/>
            <line x1="724" y1="392" x2="739" y2="392"/>
            <line x1="620" y1="328" x2="620" y2="313"/>
            <line x1="660" y1="328" x2="660" y2="313"/>
            <line x1="700" y1="328" x2="700" y2="313"/>
        </g>
        <rect x="596" y="328" width="128" height="88" rx="14" fill="#ffffff" fill-opacity="0.09"
              stroke="#8ab4f8" stroke-width="2"/>
        <rect x="612" y="344" width="96" height="56" rx="8" fill="none" stroke="#76b900" stroke-width="2"/>
        <text x="660" y="379" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">GPU</text>
    </g>
    <text x="596" y="448" fill="#ffffff" fill-opacity="0.85" font-size="14" font-weight="600"
          letter-spacing="1.2">GPU-ACCELERATED
    </text>

    <!-- Brand accent dots -->
    <g>
        <circle cx="70" cy="452" r="6" fill="#1a73e8"/>
        <circle cx="90" cy="452" r="6" fill="#ea4335"/>
        <circle cx="110" cy="452" r="6" fill="#fbbc04"/>
        <circle cx="130" cy="452" r="6" fill="#34a853"/>
    </g>
</svg>
