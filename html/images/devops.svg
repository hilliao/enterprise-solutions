<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="devops-title devops-desc" font-family="Inter, 'Segoe UI', Roboto, sans-serif">
    <title id="devops-title">DevOps &amp; System Integration</title>
    <desc id="devops-desc">Illustration of a DevOps infinity loop with code, build, deploy, and monitor stages,
        fed by a code editor and integrating with API, database, and SaaS systems through a CI/CD pipeline.
    </desc>

    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0b2b63"/>
            <stop offset="0.55" stop-color="#123a7d"/>
            <stop offset="1" stop-color="#174ea6"/>
        </linearGradient>
        <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Canvas -->
    <rect width="800" height="500" rx="24" fill="url(#bg)"/>

    <!-- Code editor feeding the loop -->
    <g>
        <rect x="70" y="64" width="150" height="96" rx="10" fill="#ffffff" fill-opacity="0.08"
              stroke="#ffffff" stroke-opacity="0.18"/>
        <circle cx="88" cy="82" r="4" fill="#ea4335"/>
        <circle cx="104" cy="82" r="4" fill="#fbbc04"/>
        <circle cx="120" cy="82" r="4" fill="#34a853"/>
        <rect x="86" y="100" width="70" height="6" rx="3" fill="#8ab4f8" fill-opacity="0.65"/>
        <rect x="86" y="114" width="104" height="6" rx="3" fill="#ffffff" fill-opacity="0.35"/>
        <rect x="86" y="128" width="54" height="6" rx="3" fill="#fbbc04" fill-opacity="0.7"/>
        <rect x="86" y="142" width="88" height="6" rx="3" fill="#ffffff" fill-opacity="0.25"/>
    </g>
    <path d="M150 164 C 190 205, 240 185, 296 173" fill="none" stroke="#8ab4f8" stroke-opacity="0.5"
          stroke-width="1.5" stroke-dasharray="2 6" stroke-linecap="round"/>

    <!-- DevOps infinity loop: dev (blue) and ops (green) -->
    <path d="M400 245 C 385 150, 235 150, 235 245 C 235 340, 385 340, 400 245"
          fill="none" stroke="#8ab4f8" stroke-width="5" stroke-linecap="round"/>
    <path d="M400 245 C 415 150, 565 150, 565 245 C 565 340, 415 340, 400 245"
          fill="none" stroke="#34a853" stroke-width="5" stroke-linecap="round"/>
    <!-- Flow arrowheads -->
    <polygon points="328,166 328,180 310,173" fill="#8ab4f8"/>
    <polygon points="472,311 472,325 490,318" fill="#34a853"/>
    <!-- Hub where dev meets ops -->
    <circle cx="400" cy="245" r="10" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="400" cy="245" r="5" fill="#1a73e8"/>

    <!-- Stage chips pinned to the loop -->
    <g font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">
        <g>
            <rect x="187" y="230" width="96" height="30" rx="15" fill="#0b2b63" stroke="#8ab4f8"
                  stroke-width="1.5"/>
            <circle cx="205" cy="245" r="5" fill="#8ab4f8"/>
            <text x="243" y="250">CODE</text>
        </g>
        <g>
            <rect x="268" y="303" width="98" height="30" rx="15" fill="#0b2b63" stroke="#fbbc04"
                  stroke-width="1.5"/>
            <circle cx="286" cy="318" r="5" fill="#fbbc04"/>
            <text x="325" y="323">BUILD</text>
        </g>
        <g>
            <rect x="430" y="157" width="110" height="30" rx="15" fill="#0b2b63" stroke="#34a853"
                  stroke-width="1.5"/>
            <circle cx="448" cy="172" r="5" fill="#34a853"/>
            <text x="493" y="177">DEPLOY</text>
        </g>
        <g>
            <rect x="507" y="230" width="118" height="30" rx="15" fill="#0b2b63" stroke="#ea4335"
                  stroke-width="1.5"/>
            <circle cx="525" cy="245" r="5" fill="#ea4335"/>
            <text x="573" y="250">MONITOR</text>
        </g>
    </g>

    <!-- Integrated systems -->
    <text x="752" y="102" text-anchor="end" fill="#ffffff" fill-opacity="0.75" font-size="13"
          font-weight="600" letter-spacing="1.2">SYSTEM INTEGRATION
    </text>
    <g stroke="#8ab4f8" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="2 6"
       stroke-linecap="round">
        <path d="M567 240 C 610 205, 625 160, 648 139" fill="none"/>
        <path d="M567 245 C 605 235, 625 218, 648 207" fill="none"/>
        <path d="M567 250 C 610 275, 625 270, 648 275" fill="none"/>
    </g>
    <g font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">
        <rect x="648" y="118" width="104" height="42" rx="10" fill="#ffffff" fill-opacity="0.09"
              stroke="#8ab4f8" stroke-width="1.5"/>
        <text x="700" y="145">API</text>
        <rect x="648" y="186" width="104" height="42" rx="10" fill="#ffffff" fill-opacity="0.09"
              stroke="#8ab4f8" stroke-width="1.5"/>
        <text x="700" y="213">DB</text>
        <rect x="648" y="254" width="104" height="42" rx="10" fill="#ffffff" fill-opacity="0.09"
              stroke="#8ab4f8" stroke-width="1.5"/>
        <text x="700" y="281">SaaS</text>
    </g>

    <!-- Caption and brand accent dots -->
    <text x="740" y="452" text-anchor="end" fill="#ffffff" fill-opacity="0.85" font-size="14"
          font-weight="600" letter-spacing="1.2">CI / CD PIPELINE
    </text>
    <g>
        <circle cx="70" cy="452" r="6" fill="#1a73e8"/>
        <circle cx="90" cy="452" r="6" fill="#ea4335"/>
        <circle cx="110" cy="452" r="6" fill="#fbbc04"/>
        <circle cx="130" cy="452" r="6" fill="#34a853"/>
    </g>
</svg>
