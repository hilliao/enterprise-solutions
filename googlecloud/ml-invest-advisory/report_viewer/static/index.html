<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Reports</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --text: #1d2330;
      --muted: #5f6b7a;
      --border: #d9dde3;
      --accent: #1a5fb4;
      --accent-soft: #e6eefa;
      --warn: #a35c00;
      --error-bg: #fdecea;
      --error-text: #8a1c12;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c;
        --surface: #1c2027;
        --text: #e4e7ec;
        --muted: #9aa4b2;
        --border: #313742;
        --accent: #7fb0ff;
        --accent-soft: #233149;
        --warn: #f0b35a;
        --error-bg: #3a1d1a;
        --error-text: #ffb4a9;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; } /* also for the elements styled display: flex */
    html, body { height: 100%; margin: 0; }
    html { -webkit-text-size-adjust: 100%; } /* no font inflation in iPhone landscape */
    /* Phones: 100dvh follows the browser toolbars as they show and hide, so the report never hides behind them. */
    @supports (height: 100dvh) { body { height: 100dvh; } }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
    header .source { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header .spacer { flex: 1; }
    button, .link-button {
      font: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }
    button:hover, .link-button:hover { border-color: var(--accent); color: var(--accent); }
    button:focus-visible, .link-button:focus-visible, [role="tab"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    /* Tab rows wrap onto more lines when the window is too narrow for one, so every tab stays visible and the rows
       re-flow as the window is resized. Phones scroll them sideways instead (see the max-width: 600px block). */
    .tab-row { background: var(--surface); border-bottom: 1px solid var(--border); }
    .tabs {
      position: relative; /* the offsetParent of its tabs, for revealSelectedTab() */
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 0 16px;
    }
    .tabs [role="tab"] { flex: none; }
    #portfolio-tabs [role="tab"] {
      border: none;
      border-bottom: 3px solid transparent;
      border-radius: 0;
      padding: 10px 12px 7px;
      background: none;
      color: var(--muted);
      font-weight: 600;
    }
    #portfolio-tabs [role="tab"][aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
    #portfolio-tabs .count {
      display: inline-block;
      margin-left: 6px;
      padding: 0 6px;
      border-radius: 10px;
      background: var(--bg);
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }
    #report-tabs { gap: 6px; padding-top: 8px; padding-bottom: 8px; }
    #report-tabs [role="tab"] { border-radius: 999px; padding: 4px 12px; }
    #report-tabs [role="tab"][aria-selected="true"] {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 12px;
      padding: 6px 16px;
      color: var(--muted);
      font-size: 12px;
    }
    .meta .file { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    .meta .stale { color: var(--warn); font-weight: 600; }
    .meta .actions { margin-left: auto; display: flex; gap: 6px; }

    main { position: relative; flex: 1; min-height: 0; margin: 0 16px 16px; }
    main iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface); /* matches the reports' dark theme, so no white flash while one loads */
    }
    .status { padding: 32px 16px; text-align: center; color: var(--muted); }
    .status.error {
      margin: 16px;
      padding: 16px;
      border-radius: 8px;
      background: var(--error-bg);
      color: var(--error-text);
      text-align: left;
      white-space: pre-wrap;
    }

    .user { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; min-width: 0; }
    .user span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user form { margin: 0; }
    .sign-in {
      max-width: 28em;
      margin: 48px auto;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      text-align: center;
    }
    .sign-in h2 { margin: 0 0 8px; font-size: 18px; }
    .sign-in p { margin: 0 0 16px; color: var(--muted); }
    .sign-in .link-button {
      display: inline-block;
      padding: 8px 16px;
      background: var(--accent);
      border-color: var(--accent);
      color: var(--surface);
      font-weight: 600;
    }
    .sign-in .link-button:hover { color: var(--surface); opacity: 0.9; }

    /* Phones (e.g. iPhone 13 at 390px, Galaxy S26 at ~412px): one row per tab list that scrolls sideways, as nine
       wrapped report tabs would take a third of the screen. An edge fades out while more tabs lie beyond it
       (.more-left / .more-right, set by updateOverflowCues()), and the mouse wheel scrolls the row too. */
    @media (max-width: 600px) {
      header { gap: 8px; padding: 8px 12px; }
      header h1 { font-size: 15px; }
      header .source, .user span { display: none; }
      .tabs {
        flex-wrap: nowrap;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        scroll-snap-type: x proximity;
        scrollbar-width: none;
        padding: 0 12px;
      }
      .tabs::-webkit-scrollbar { display: none; }
      .tabs [role="tab"] { scroll-snap-align: start; scroll-margin: 0 40px; }
      #report-tabs { padding: 8px 12px; }
      .tabs.more-right {
        -webkit-mask-image: linear-gradient(to left, transparent, #000 40px);
        mask-image: linear-gradient(to left, transparent, #000 40px);
      }
      .tabs.more-left {
        -webkit-mask-image: linear-gradient(to right, transparent, #000 40px);
        mask-image: linear-gradient(to right, transparent, #000 40px);
      }
      .tabs.more-left.more-right {
        -webkit-mask-image: linear-gradient(to right, transparent, #000 40px, #000 calc(100% - 40px), transparent);
        mask-image: linear-gradient(to right, transparent, #000 40px, #000 calc(100% - 40px), transparent);
      }
      .meta { padding: 6px 12px; }
      .meta .file { font-size: 11px; }
      .meta .actions { margin-left: 0; }
      main { margin: 0 8px 8px; }
    }
    /* Touch screens (phones, iPad): larger tap targets. */
    @media (pointer: coarse) {
      button, .link-button { padding: 6px 12px; }
      #portfolio-tabs [role="tab"] { padding: 12px 14px 9px; }
      #report-tabs [role="tab"] { padding: 7px 14px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Portfolio Reports</h1>
    <span class="source" id="source"></span>
    <span class="spacer"></span>
    <span class="user" id="user" hidden>
      <span id="user-email"></span>
      <form method="post" action="/auth/logout"><button type="submit">Sign out</button></form>
    </span>
    <button type="button" id="refresh" title="List the reports in Cloud Storage again">Refresh list</button>
  </header>
  <section class="sign-in" id="sign-in" hidden>
    <h2 id="sign-in-title">Sign in to view the reports</h2>
    <p id="sign-in-text">Use a Google account that can read the reports in Cloud Storage.</p>
    <a class="link-button" id="sign-in-link" href="/auth/login">Sign in with Google</a>
  </section>
  <div class="tab-row" id="portfolio-row"><nav class="tabs" id="portfolio-tabs" role="tablist" aria-label="Portfolios"></nav></div>
  <div class="tab-row" id="report-row"><nav class="tabs" id="report-tabs" role="tablist" aria-label="Reports"></nav></div>
  <div class="meta" id="meta" hidden>
    <span id="meta-updated"></span>
    <span id="meta-size"></span>
    <span class="file" id="meta-file"></span>
    <span class="actions">
      <button type="button" id="reload" title="Fetch this report from Cloud Storage again">Reload</button>
      <a class="link-button" id="open-gcs" target="_blank" rel="noopener"
         title="Open the authenticated storage.cloud.google.com URL in a new browser tab">Open in Cloud Storage ↗</a>
    </span>
  </div>
  <main id="viewer" role="tabpanel" aria-live="polite">
    <div class="status" id="status">Loading report list…</div>
  </main>

  <script>
    'use strict';
    const STALE_HOURS = 24;
    const state = { groups: [], portfolio: null, file: null };
    const frames = new Map(); // report file -> iframe, kept so switching back to a tab is instant
    const $ = (id) => document.getElementById(id);

    function reportsOf(portfolio) {
      return (state.groups.find((group) => group.portfolio === portfolio) || { reports: [] }).reports;
    }
    function findReport(file) {
      for (const group of state.groups) {
        const report = group.reports.find((r) => r.file === file);
        if (report) return { group, report };
      }
      return null;
    }

    function relativeTime(iso) {
      const minutes = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
      if (minutes < 1) return 'just now';
      if (minutes < 60) return `${minutes} min ago`;
      const hours = Math.round(minutes / 60);
      if (hours < 48) return `${hours} h ago`;
      return `${Math.round(hours / 24)} days ago`;
    }

    function makeTab(label, selected, onSelect, extra) {
      const tab = document.createElement('button');
      tab.type = 'button';
      tab.setAttribute('role', 'tab');
      tab.setAttribute('aria-selected', String(selected));
      tab.setAttribute('aria-controls', 'viewer');
      tab.tabIndex = selected ? 0 : -1;
      tab.textContent = label;
      if (extra) tab.append(extra);
      tab.addEventListener('click', onSelect);
      return tab;
    }

    // Arrow keys, Home and End move between the tabs of a tab list (WAI-ARIA tabs pattern).
    function enableKeyboard(tablist) {
      tablist.addEventListener('keydown', (event) => {
        const tabs = [...tablist.querySelectorAll('[role="tab"]')];
        const index = tabs.indexOf(document.activeElement);
        if (index < 0) return;
        const next = { ArrowRight: index + 1, ArrowLeft: index - 1, Home: 0, End: tabs.length - 1 }[event.key];
        if (next === undefined) return;
        event.preventDefault();
        const target = tabs[(next + tabs.length) % tabs.length];
        target.click();
        // The tab list is re-rendered on click; focus the new element with the same position.
        tablist.querySelectorAll('[role="tab"]')[(next + tabs.length) % tabs.length].focus();
      });
    }

    // A tab row that scrolls sideways (phones) fades out the edge beyond which more tabs lie.
    function updateOverflowCues(tablist) {
      const hidden = tablist.scrollWidth - tablist.clientWidth;
      tablist.classList.toggle('more-left', hidden > 1 && tablist.scrollLeft > 1);
      tablist.classList.toggle('more-right', hidden > 1 && tablist.scrollLeft < hidden - 1);
    }

    // Scrolls a sideways tab row so its selected tab is clear of the faded edges.
    function revealSelectedTab(tablist) {
      const tab = tablist.querySelector('[aria-selected="true"]');
      if (!tab || tablist.scrollWidth <= tablist.clientWidth) return;
      const margin = 40;
      const left = tab.offsetLeft - margin;
      const right = tab.offsetLeft + tab.offsetWidth + margin - tablist.clientWidth;
      if (tablist.scrollLeft > left) tablist.scrollLeft = left;
      else if (tablist.scrollLeft < right) tablist.scrollLeft = right;
    }

    function enableSidewaysScrolling(tablist) {
      tablist.addEventListener('scroll', () => updateOverflowCues(tablist), { passive: true });
      // A mouse wheel only scrolls up and down; turn that into sideways scrolling while the row overflows.
      tablist.addEventListener('wheel', (event) => {
        if (tablist.scrollWidth <= tablist.clientWidth || Math.abs(event.deltaX) >= Math.abs(event.deltaY)) return;
        event.preventDefault();
        tablist.scrollLeft += event.deltaY;
      }, { passive: false });
      // Resizing or rotating the window switches between wrapped and sideways rows.
      new ResizeObserver(() => {
        revealSelectedTab(tablist);
        updateOverflowCues(tablist);
      }).observe(tablist);
    }

    function renderTabs() {
      const portfolioTabs = $('portfolio-tabs');
      portfolioTabs.replaceChildren(...state.groups.map((group) => {
        const count = document.createElement('span');
        count.className = 'count';
        count.textContent = group.reports.length;
        return makeTab(group.portfolio, group.portfolio === state.portfolio,
                       () => selectPortfolio(group.portfolio), count);
      }));
      const reportTabs = $('report-tabs');
      reportTabs.replaceChildren(...reportsOf(state.portfolio).map((report) =>
        makeTab(report.label, report.file === state.file, () => selectReport(report.file))));
      for (const tablist of [portfolioTabs, reportTabs]) {
        revealSelectedTab(tablist);
        updateOverflowCues(tablist);
      }
    }

    function selectPortfolio(portfolio) {
      const reports = reportsOf(portfolio);
      if (reports.length) selectReport(reports[0].file);
    }

    function selectReport(file) {
      const found = findReport(file);
      if (!found) return;
      state.portfolio = found.group.portfolio;
      state.file = file;
      history.replaceState(null, '', `#${encodeURIComponent(file)}`);
      renderTabs();
      showFrame(found.report);
      renderMeta(found.report);
    }

    function showFrame(report) {
      $('status').hidden = true;
      let frame = frames.get(report.file);
      if (!frame) {
        frame = document.createElement('iframe');
        frame.title = `${state.portfolio}: ${report.label}`;
        // No allow-scripts: the reports are static. allow-same-origin only lets this page retarget their links;
        // top navigation lets the "Sign in with Google" link of an expired-session page leave the frame.
        frame.sandbox = 'allow-same-origin allow-popups allow-popups-to-escape-sandbox ' +
                        'allow-top-navigation-by-user-activation';
        frame.addEventListener('load', () => openExternalLinksInNewTab(frame));
        frame.src = `/reports/${report.file.split('/').map(encodeURIComponent).join('/')}`;
        frames.set(report.file, frame);
        $('viewer').append(frame);
      }
      for (const [file, other] of frames) other.hidden = file !== report.file;
      document.title = `${state.portfolio} · ${report.label} — Portfolio Reports`;
    }

    function openExternalLinksInNewTab(frame) {
      try {
        for (const link of frame.contentDocument.querySelectorAll('a[href]')) {
          if (!link.getAttribute('href').startsWith('#')) {
            link.target = '_blank';
            link.rel = 'noopener';
          }
        }
      } catch (error) { /* cross-origin error page; leave it as is */ }
    }

    function renderMeta(report) {
      $('meta').hidden = false;
      const updated = $('meta-updated');
      const ageHours = (Date.now() - new Date(report.updated).getTime()) / 3600000;
      updated.textContent = `Updated ${relativeTime(report.updated)}`;
      updated.title = new Date(report.updated).toLocaleString();
      updated.className = ageHours > STALE_HOURS ? 'stale' : '';
      $('meta-size').textContent = `${(report.size / 1024).toFixed(0)} KB`;
      $('meta-file').textContent = report.file;
      $('open-gcs').href = report.auth_url;
    }

    function showError(message) {
      for (const frame of frames.values()) frame.hidden = true;
      const status = $('status');
      status.hidden = false;
      status.className = 'status error';
      status.textContent = message;
    }

    // The selected tab (URL hash) is kept across the Google sign-in round trip, which drops the hash.
    const SAVED_HASH_KEY = 'report-viewer-hash';
    function saveHash() {
      try { sessionStorage.setItem(SAVED_HASH_KEY, location.hash); } catch (error) { /* storage blocked */ }
    }
    function restoreHash() {
      try {
        const saved = sessionStorage.getItem(SAVED_HASH_KEY);
        sessionStorage.removeItem(SAVED_HASH_KEY);
        if (saved && !location.hash) history.replaceState(null, '', saved);
      } catch (error) { /* storage blocked */ }
    }

    // Shows the report UI (signedIn) or the sign-in card with a title and text, and resets the reports when signed out.
    function showSignedIn(signedIn, email, title, text) {
      for (const id of ['portfolio-row', 'report-row', 'viewer', 'refresh']) $(id).hidden = !signedIn;
      $('sign-in').hidden = signedIn;
      $('user').hidden = !email;
      $('user-email').textContent = email || '';
      if (signedIn) return;
      $('meta').hidden = true;
      $('sign-in-title').textContent = title;
      $('sign-in-text').textContent = text;
      state.groups = [];
      for (const frame of frames.values()) frame.remove();
      frames.clear();
    }

    async function loadReports() {
      const status = $('status');
      status.className = 'status';
      try {
        const response = await fetch('/api/reports', { cache: 'no-store', credentials: 'same-origin' });
        const body = await response.json();
        if (response.status === 401) {
          showSignedIn(false, null, 'Sign in to view the reports',
                       'Use a Google account that can read the reports in Cloud Storage.');
          return;
        }
        if (response.status === 403) {
          showSignedIn(false, body.user, 'No access to the reports',
                       `${body.error} Sign out and sign in with an account that can read the bucket.`);
          return;
        }
        if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
        showSignedIn(true, body.user);
        const previous = new Map(state.groups.flatMap((g) => g.reports).map((r) => [r.file, r.updated]));
        state.groups = body.groups;
        $('source').textContent = `gs://${body.bucket}/${body.prefix}`;
        // Drop cached frames of reports that were removed or re-uploaded since the last listing.
        for (const [file, frame] of frames) {
          const found = findReport(file);
          if (!found || found.report.updated !== previous.get(file)) {
            frame.remove();
            frames.delete(file);
          }
        }
        if (!state.groups.length) {
          $('meta').hidden = true;
          renderTabs();
          showError(`No HTML reports found in gs://${body.bucket}/${body.prefix}`);
          return;
        }
        const wanted = decodeURIComponent(location.hash.slice(1));
        const file = findReport(state.file) ? state.file : findReport(wanted) ? wanted : state.groups[0].reports[0].file;
        selectReport(file);
      } catch (error) {
        showError(`Could not list the reports: ${error.message}\n\nCheck the terminal running report_viewer.py.`);
      }
    }

    $('sign-in-link').addEventListener('click', saveHash);
    $('refresh').addEventListener('click', loadReports);
    $('reload').addEventListener('click', () => {
      const frame = frames.get(state.file);
      if (frame) frame.src = frame.src;
    });
    window.addEventListener('hashchange', () => {
      const file = decodeURIComponent(location.hash.slice(1));
      if (file !== state.file && findReport(file)) selectReport(file);
    });
    for (const tablist of [$('portfolio-tabs'), $('report-tabs')]) {
      enableKeyboard(tablist);
      enableSidewaysScrolling(tablist);
    }
    restoreHash();
    loadReports();
  </script>
</body>
</html>
